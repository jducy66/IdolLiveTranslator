name: IdolLiveTranslator
options:
  bundleIdPrefix: com.pan
  deploymentTarget:
    iOS: "16.0"
targets:
  IdolLiveTranslator:
    type: application
    platform: iOS
    sources:
      - App
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: 爱豆同传
        UILaunchScreen: {}
        NSMicrophoneUsageDescription: 需要麦克风权限以识别直播语音并生成实时翻译字幕
        NSSpeechRecognitionUsageDescription: 需要语音识别权限将韩语或日语实时转换为文字
        UIBackgroundModes:
          - audio
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.pan.idollivetranslator
      MARKETING_VERSION: "1.0.0"
      CURRENT_PROJECT_VERSION: "1"
      CODE_SIGN_IDENTITY: ""
      CODE_SIGNING_REQUIRED: "NO"
      CODE_SIGNING_ALLOWED: "NO"
    dependencies:
      - target: BroadcastExtension
        embed: true
  BroadcastExtension:
    type: app-extension
    platform: iOS
    sources:
      - BroadcastExtension
    info:
      path: BroadcastExtension/Info.plist
      properties:
        CFBundleDisplayName: 直播内录捕获
        NSExtension:
          NSExtensionPointIdentifier: com.apple.broadcast-services-upload
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).SampleHandler
          RPBroadcastProcessMode: RPBroadcastProcessModeSampleBuffer
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.pan.idollivetranslator.broadcast
      MARKETING_VERSION: "1.0.0"
      CURRENT_PROJECT_VERSION: "1"
      CODE_SIGN_IDENTITY: ""
      CODE_SIGNING_REQUIRED: "NO"
      CODE_SIGNING_ALLOWED: "NO"
